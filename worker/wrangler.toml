name = "sharizz-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

account_id = "393fdc11838d18b9d1793acd906cdffe"

[vars]
MAX_FILE_SIZE = "5368709120"
MAX_FILES_PER_ROOM = "500"
MAX_ROOM_STORAGE = "21474836480"
MAX_GATE_ATTEMPTS = "3"
GATE_LOCKOUT_MS = "60000"
DOWNLOAD_ALL_ZIP_MAX_BYTES = "2147483648"

[[d1_databases]]
binding = "DB"
database_name = "sharizz-db"
database_id = "937d592d-fd42-4ef4-aed7-0ff5ef7d73ea"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sharizz-media"

# This Worker is a cron-only deployment: the frontend and /api/* are now
# served standalone from Cloudflare Pages (see frontend/wrangler.toml and
# frontend/functions/api/[[path]].ts), since Pages Functions can't run
# scheduled() triggers. This Worker's only job is the hourly expired-room
# sweep below — its HTTP routes (same `app` the Pages Function reuses)
# still work if hit directly at its workers.dev URL, but nothing routes
# production traffic to them.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
