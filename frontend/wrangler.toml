name = "sharizz"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# No account_id here: Pages config doesn't support it — the project's
# account is fixed by whichever Cloudflare account the "sharizz" Pages
# project was created under. (worker/wrangler.toml still sets account_id
# since that's a plain Worker, where it's required/allowed.)

[vars]
MAX_FILE_SIZE = "5368709120"
MAX_FILES_PER_ROOM = "500"
MAX_ROOM_STORAGE = "21474836480"
MAX_GATE_ATTEMPTS = "3"
GATE_LOCKOUT_MS = "60000"
DOWNLOAD_ALL_ZIP_MAX_BYTES = "2147483648"

[[d1_databases]]
binding = "DB"
database_name = "sharizz-db"
database_id = "937d592d-fd42-4ef4-aed7-0ff5ef7d73ea"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sharizz-media"
